; FreeCam in camera mode. Rename this file to FreeCam.ini to use it.
;
; Player mode flies the player and lets the game's camera follow. Camera mode takes the
; camera matrix itself, which is the real thing: the player stands still and the camera
; goes wherever you point it. It needs the address of the game's view matrix, and that
; is the part we cannot guess - the game's own code has to be read to find it.
;
; How to find it:
;   1. Run FreeCam in player mode first and check that free cam works at all
;      (FreeCam.log says "matrix at 0x..." when it has one).
;   2. In camera mode, put the candidate address in `address=` below, press CapsLock,
;      and see whether the view jumps. If FreeCam.log says "that is not a transform",
;      the address is not a matrix.
;   3. If the view moves but the world slides sideways, the matrix is transposed or it
;      is a projection matrix; try matrix=view, and the other way round.
;   4. Press F10 after each try: it puts the matrix back exactly as it found it.

[game]
module=

[freecam]
mode=camera
; e.g. address=0x7ff6a1b2c3d0  (leave empty until you have one)
address=
chain=
matrix=view

speed=14
sprint=5
slow=0.2
sensitivity=0.0028
invert_y=false
max_distance=4000
eye_height=0
restore=true
toggle=capslock
panic=f10
