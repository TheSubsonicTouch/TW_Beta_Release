; FreeCam settings. Edit, save, and the DLL picks the file up within a couple of seconds.
; A line that cannot be understood is written to FreeCam.log and skipped, so a typo
; never stops the camera from working.

[game]
; Which module the offsets below are counted from. Empty = the game itself (TriadWars.exe).
module=

[freecam]
; player  = fly the player; the game's camera follows, which looks like a free camera
; camera  = fly the camera matrix directly (needs the camera's address, see below)
mode=player

; Where the 4x4 matrix lives, as a pointer chain from the module above:
;   module + 0x23f25f8 -> read a pointer, + 0x58 -> read a pointer, + 0x80 = the matrix
; This is the same chain the debug menu's own ReadPlayerMatrix uses, so it is the one
; address in the game we can be sure of.
chain=0x23f25f8,0x58,0x80

; A plain absolute address instead of a chain. Takes priority when set.
; Set this once the camera itself has been found; the address changes every launch
; unless the module is loaded at a fixed base, so a chain is usually the better tool.
address=

; world = rows are right/up/forward and row 3 is the position (an object's transform)
; view  = the same with -forward and a negated dot product (a camera's view matrix)
matrix=world

; Units per second, and the multipliers for Shift and Ctrl.
speed=14
sprint=5
slow=0.2

; Radians of turn per pixel of mouse movement. 0.0028 is about 0.16 degrees.
sensitivity=0.0028

; Invert the mouse's vertical axis. true or false.
invert_y=false

; Safety leash: free cam refuses to fly further than this from where it started.
max_distance=4000

; How far above the target the camera starts. 2 looks straight over the shoulder.
eye_height=2

; Put the matrix back exactly as it was when free cam is switched off.
restore=true

; Keys, by name (capslock, insert, home, f1..f12, mouse2, ...) or as 0x14 style codes.
toggle=capslock
panic=f10
